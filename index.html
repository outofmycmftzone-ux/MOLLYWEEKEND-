<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Molly Weekend</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
</head>

<body>

<div id="app">

<div id="menu">

<h1>Molly Weekend</h1>

<button class="deck" onclick="openDeck('tame')">
🔵 TAME
<span>The Spark<br>Conversation Starters</span>
</button>

<button class="deck" onclick="openDeck('desire')">
🔴 DESIRE
<span>The Heat<br>Light Foreplay</span>
</button>

<button class="deck" onclick="openDeck('touch')">
🟣 TOUCH ME
<span>The Connection<br>Deep Intimacy</span>
</button>

<button class="deck" onclick="openDeck('slowburn')">
🔥 SLOW BURN
<span>Build the tension together</span>
</button>

<button class="deck" onclick="openDeck('random')">
✨ RANDOM WEEKEND
<span>Anything can happen</span>
</button>

<button class="deck" onclick="openDice()">
🎲 EROTIC DICE
<span>Roll for body part and action</span>
</button>

<button class="deck bingo-button" onclick="openBingo()">
🔥 COUPLES BINGO
<span>Complete the squares<br>First line wins</span>
</button>

</div>

<div id="deckIntro" style="display:none;">

<h2 id="deckTitle"></h2>

<p id="deckDescription"></p>

<button onclick="startGame()">
START
</button>

<button onclick="goBack()">
BACK
</button>

</div>

<div id="game" style="display:none;">

<div id="category"></div>

<div id="action"></div>

<div id="remaining"></div>

<button onclick="drawCard()">
DRAW CARD
</button>

<button onclick="goBack()">
BACK
</button>

</div>

<div id="diceGame" style="display:none;">

<h2>🎲 EROTIC DICE</h2>

<div class="dice-container">

<div class="dice-result">
Body Part
<strong id="diceBody">—</strong>
</div>

<div class="dice-result">
Action
<strong id="diceAction">—</strong>
</div>

<button onclick="rollDice()">
ROLL DICE
</button>

<button onclick="closeDice()">
BACK
</button>

</div>

</div>

<div id="bingoGame" style="display:none;">

<div class="bingo-header">

<h2 class="bingo-title">🔥 SPICY COUPLES BINGO</h2>

<p class="bingo-subtitle">
Mark squares as you complete them.<br>
First to a full line wins.
</p>

</div>

<div class="bingo-controls">

<div class="bingo-name-row">

<input
id="bingoName1"
type="text"
placeholder="Partner 1 name"
maxlength="20"
>

<input
id="bingoName2"
type="text"
placeholder="Partner 2 name"
maxlength="20"
>

</div>

<div class="bingo-kink-section">

<div class="bingo-section-title">
Intensity / Kinks
</div>

<div class="bingo-kinks" id="bingoKinkToggles">

<label>
<input type="checkbox" value="soft" checked>
Soft
</label>

<label>
<input type="checkbox" value="tease" checked>
Tease
</label>

<label>
<input type="checkbox" value="oral" checked>
Oral
</label>

<label>
<input type="checkbox" value="touch" checked>
Touch
</label>

<label>
<input type="checkbox" value="toys">
Toys
</label>

<label>
<input type="checkbox" value="bdsm">
Light BDSM
</label>

<label>
<input type="checkbox" value="role">
Roleplay
</label>

<label>
<input type="checkbox" value="intense">
Intense
</label>

</div>

</div>

<div class="bingo-board-size">

<div class="bingo-section-title">
Board Size
</div>

<select id="bingoSize">

<option value="3">
3 × 3
</option>

<option value="4">
4 × 4
</option>

<option value="5" selected>
5 × 5
</option>

</select>

</div>

<div class="bingo-button-row">

<button
type="button"
onclick="generateBingoBoard()">
New Board
</button>

<button
type="button"
class="bingo-secondary"
onclick="resetBingoMarks()">
Reset Marks
</button>

</div>

</div>

<div class="bingo-board-wrap">

<div id="bingoBoard" class="bingo-board"></div>

<div id="bingoStatus" class="bingo-status">
Complete a row, column, or diagonal to win!
</div>

</div>

<button
type="button"
class="bingo-back"
onclick="closeBingo()">
← Back to Menu
</button>

</div>

</div>

<script src="script.js"></script>

<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js")
        .catch(error => console.error(error));
}
</script>

</body>
</html>
